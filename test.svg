<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      transform-box: fill-box;
      transform-origin: center;
      animation: 
        spin 3s linear infinite,
        rainbow 5s linear infinite
      ;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes rainbow {
        0% { fill: #ff0000; }
        17% { fill: #ffff00; }
        33% { fill: #00ff00; }
        50% { fill: #00ffff; }
        67% { fill: #0000ff; }
        83% { fill: #ff00ff; }
        100% { fill: #ff0000; }
    }
  </style>

  <text x="100" y="100"
        text-anchor="middle"
        dominant-baseline="middle">
    Hello there.
  </text>
</svg>
